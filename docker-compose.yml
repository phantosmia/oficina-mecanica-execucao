# Ambiente local da Execução: LocalStack (DynamoDB, SQS, SNS) + API + worker +
# relay da outbox. O docker-compose com os 5 microsserviços juntos fica no
# repositório oficina-mecanica-fiap (OS Service).
#
# A conclusão do diagnóstico consulta o Catálogo por REST. Aqui ele é
# esperado no host, na porta 8001 (o docker-compose do oficina-mecanica-catalogo
# já sobe nessa porta); ajuste CATALOG_BASE_URL se estiver em outro lugar.
x-execucao-env: &execucao-env
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://localstack:4566
  EXECUCAO_TABLE_NAME: oficina-execucao
  EXECUCAO_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:execucao-eventos
  EXECUCAO_COMMANDS_QUEUE_URL: http://localstack:4566/000000000000/execucao-comandos
  CATALOG_BASE_URL: http://host.docker.internal:8001
  JWT_SECRET_KEY: change-me-in-production
  ADMIN_USERNAME: admin

services:
  localstack:
    image: localstack/localstack:4
    container_name: execucao-localstack
    environment:
      SERVICES: dynamodb,sns,sqs
    ports:
      - "4568:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: execucao-api
    environment:
      <<: *execucao-env
      BOOTSTRAP_LOCAL_RESOURCES: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8000"
    depends_on:
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    container_name: execucao-worker
    command: ["worker"]
    environment:
      <<: *execucao-env
    depends_on:
      api:
        condition: service_healthy

  outbox-relay:
    build: .
    container_name: execucao-outbox-relay
    command: ["relay"]
    environment:
      <<: *execucao-env
    depends_on:
      api:
        condition: service_healthy
