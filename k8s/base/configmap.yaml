apiVersion: v1
kind: ConfigMap
metadata:
  name: execucao-config
  namespace: oficina-execucao
data:
  AWS_REGION: us-east-1
  # Sobrescritos pelo overlay com os outputs do Terraform do serviço.
  EXECUCAO_TABLE_NAME: oficina-execucao
  EXECUCAO_EVENTS_TOPIC_ARN: ""
  EXECUCAO_COMMANDS_QUEUE_URL: ""
  # Service do Catálogo no mesmo cluster (namespace oficina-catalogo).
  CATALOG_BASE_URL: http://catalogo-api.oficina-catalogo.svc.cluster.local:8000
  CATALOG_TIMEOUT_SECONDS: "3"
  ADMIN_USERNAME: admin
  JWT_ALGORITHM: HS256
  LOG_LEVEL: INFO
  # ADR-0007: só ativa de fato com NEW_RELIC_LICENSE_KEY (secret) definida.
  NEW_RELIC_APP_NAME: oficina-mecanica-execucao
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
